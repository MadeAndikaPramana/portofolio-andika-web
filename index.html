<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- No tab icon on purpose: an empty data URL stops the browser asking for /favicon.ico. -->
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Andika Pramana — Web developer in Bali</title>
    <meta name="description" content="Andika Pramana builds fast, good-looking websites for Bali businesses, made so customers can message you in one tap." />
    <link rel="canonical" href="https://www.andikapramana.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.andikapramana.com/" />
    <meta property="og:title" content="Andika Pramana — Web developer in Bali" />
    <meta property="og:description" content="Websites for Bali businesses that make people message you." />
    <meta property="og:image" content="https://www.andikapramana.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Andika Pramana, web developer in Bali: websites that make people message you." />
    <meta property="og:site_name" content="Andika Pramana" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Crawler-facing content and structured data are filled in at build time from src/data.js (see vite.config.js). -->
    <style>
      /* Plain-HTML copy of the page for crawlers that do not run JavaScript. React replaces it on load; it stays out of
         sight meanwhile so it never flashes, and shows normally when JavaScript is off. */
      #root > .prerender { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    </style>
    <noscript><style>#root > .prerender { position: static; width: auto; height: auto; overflow: visible; clip-path: none; padding: 1.5rem; }</style></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
